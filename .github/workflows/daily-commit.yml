
name: Daily GitHub Activity

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity
        run: |
          mkdir -p activity
          echo "Last updated: $(date -u)" > activity/daily.txt

      - name: Commit and push
        run: |
          git config user.name "lakshmi22-2007"
          git config user.email "${{ secrets.COMMIT_EMAIL }}"
          git add activity/daily.txt
          git diff --cached --quiet || git commit -m "chore: automated daily update"
          git push
