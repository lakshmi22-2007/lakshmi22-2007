<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 290" width="490" height="290" role="img" aria-label="Payment Recovery Prediction - ML, SQL and Streamlit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a1f"/>
      <stop offset="100%" stop-color="#0a3d30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0F6E56"/>
      <stop offset="100%" stop-color="#4ff0c0"/>
    </linearGradient>
    <clipPath id="r"><rect width="490" height="290" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <rect width="490" height="290" fill="url(#bg)"/>
    <rect x="1" y="1" width="488" height="288" rx="17" fill="none" stroke="#1D9E75" stroke-opacity="0.6"/>

    <!-- animated bar chart motif -->
    <g transform="translate(380,28)">
      <rect x="0" y="30" width="12" height="30" rx="3" fill="url(#bar)">
        <animate attributeName="height" values="30;18;30" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;42;30" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="14" width="12" height="46" rx="3" fill="url(#bar)">
        <animate attributeName="height" values="46;28;46" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;32;14" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="0" width="12" height="60" rx="3" fill="url(#bar)">
        <animate attributeName="height" values="60;40;60" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;20;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="22" width="12" height="38" rx="3" fill="url(#bar)">
        <animate attributeName="height" values="38;54;38" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;6;22" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <line x1="-6" y1="62" x2="74" y2="62" stroke="#4ff0c0" stroke-opacity="0.6"/>
    </g>

    <text x="28" y="50" font-size="13" fill="#4ff0c0" letter-spacing="4" font-family="Consolas, Menlo, monospace">PROJECT 02</text>
    <text x="28" y="88" font-size="29" font-weight="800" fill="#ffffff" letter-spacing="2">PAYMENT RECOVERY</text>
    <text x="28" y="116" font-size="16" fill="#9ffbe0">ML + SQL + Streamlit, end to end</text>

    <text x="28" y="152" font-size="13.5" fill="#d6fff2" fill-opacity="0.85">Predicts which failed payments are recovered within 30 days,</text>
    <text x="28" y="172" font-size="13.5" fill="#d6fff2" fill-opacity="0.85">ranked by expected revenue (amount × probability).</text>

    <!-- metrics pill -->
    <rect x="28" y="190" width="338" height="26" rx="13" fill="#4ff0c0" fill-opacity="0.12" stroke="#4ff0c0" stroke-opacity="0.6"/>
    <text x="42" y="208" font-size="12.5" fill="#9ffbe0" font-weight="600">◆ Calibrated LogReg · PR AUC · Brier Score · Lift</text>

    <!-- tech pills -->
    <g font-size="12" font-family="Consolas, Menlo, monospace" fill="#ccffee">
      <rect x="28" y="238" width="70" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="63" y="255" text-anchor="middle">Python</text>
      <rect x="106" y="238" width="106" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="159" y="255" text-anchor="middle">scikit-learn</text>
      <rect x="220" y="238" width="108" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="274" y="255" text-anchor="middle">PostgreSQL</text>
      <rect x="336" y="238" width="96" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="384" y="255" text-anchor="middle">Streamlit</text>
    </g>
  </g>
</svg>
