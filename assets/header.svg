<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="B Lakshmi Narayanan - Software Development Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01120d"/>
      <stop offset="55%" stop-color="#0a3d30"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c8fff0"/>
      <stop offset="100%" stop-color="#4ff0c0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ff0c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D9E75" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- scanning light bar -->
    <rect y="0" width="160" height="280" fill="url(#scan)">
      <animate attributeName="x" from="-200" to="1050" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating nodes -->
    <g fill="#4ff0c0">
      <circle cx="90" cy="60" r="3"><animate attributeName="cy" values="60;80;60" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="210" r="2.5"><animate attributeName="cy" values="210;190;210" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="70" r="3"><animate attributeName="cy" values="70;50;70" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="200" r="2.5"><animate attributeName="cy" values="200;220;200" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="235" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke="#4ff0c0" stroke-opacity="0.25" stroke-width="1">
      <line x1="90" y1="60" x2="210" y2="40"/>
      <line x1="170" y1="210" x2="90" y2="60"/>
      <line x1="880" y1="70" x2="930" y2="200"/>
      <line x1="930" y1="200" x2="800" y2="235"/>
    </g>

    <!-- corner brackets -->
    <g fill="none" stroke="#4ff0c0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M30 60 V30 H60"/>
      <path d="M940 30 H970 V60"/>
      <path d="M30 220 V250 H60"/>
      <path d="M970 220 V250 H940"/>
    </g>

    <!-- top tag -->
    <text x="500" y="62" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" fill="#4ff0c0" letter-spacing="4">
      &lt;/&gt; HELLO, WORLD — I AM
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- name -->
    <text x="500" y="141" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="url(#name)" filter="url(#glow)">B LAKSHMI NARAYANAN</text>

    <!-- animated underline -->
    <line x1="300" y1="164" x2="700" y2="164" stroke="#4ff0c0" stroke-width="3" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" values="400;0;0;400" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- role -->
    <text x="500" y="204" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="20" fill="#9ffbe0" letter-spacing="7">SOFTWARE DEVELOPMENT ENGINEER</text>

    <!-- stack line -->
    <text x="500" y="244" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#7fffd4" fill-opacity="0.75" letter-spacing="3">BACKEND  •  FULL-STACK  •  CLOUD  •  AI SYSTEMS</text>
  </g>
</svg>
