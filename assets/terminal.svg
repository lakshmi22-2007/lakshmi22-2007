<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Terminal: whoami, role, mission, projects and developer card">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#06100d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12352b"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F6E56" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="r"><rect width="1000" height="380" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#r)" font-family="Consolas, Menlo, 'Courier New', monospace">
    <rect width="1000" height="380" fill="url(#win)"/>

    <!-- title bar -->
    <rect width="1000" height="44" fill="url(#bar)"/>
    <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="22" r="7" fill="#febc2e"/>
    <circle cx="76" cy="22" r="7" fill="#28c840"/>
    <text x="500" y="27" text-anchor="middle" font-size="14" fill="#bfffe9" letter-spacing="1">lakshmi@dev: ~/profile — zsh</text>

    <!-- left: terminal output -->
    <g font-size="16">
      <text x="34" y="92"><tspan fill="#1D9E75">❯</tspan><tspan fill="#ffffff"> whoami</tspan></text>
      <text x="34" y="118" fill="#7fffd4">lakshmi-narayanan</text>

      <text x="34" y="160"><tspan fill="#1D9E75">❯</tspan><tspan fill="#ffffff"> cat role.txt</tspan></text>
      <text x="34" y="186" fill="#7fffd4">Software Development Engineer</text>

      <text x="34" y="228"><tspan fill="#1D9E75">❯</tspan><tspan fill="#ffffff"> cat mission.txt</tspan></text>
      <text x="34" y="254" fill="#7fffd4">Build scalable backends, full-stack apps</text>
      <text x="34" y="277" fill="#7fffd4">and AI-integrated systems that last.</text>

      <text x="34" y="319"><tspan fill="#1D9E75">❯</tspan><tspan fill="#ffffff"> ls ./projects</tspan></text>
      <text x="34" y="345"><tspan fill="#4ff0c0">geostorm/</tspan><tspan fill="#9ffbe0">   payment-recovery-prediction/</tspan></text>
      <rect x="34" y="354" width="10" height="3" fill="#4ff0c0">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- divider -->
    <line x1="600" y1="64" x2="600" y2="360" stroke="#1D9E75" stroke-opacity="0.25"/>

    <!-- right: developer card -->
    <g transform="translate(630,66)">
      <rect width="340" height="290" rx="14" fill="url(#card)" stroke="#1D9E75" stroke-opacity="0.6"/>
      <text x="22" y="36" font-size="15" fill="#4ff0c0" letter-spacing="4" font-weight="bold">DEVELOPER CARD</text>
      <line x1="22" y1="50" x2="318" y2="50" stroke="#1D9E75" stroke-opacity="0.4"/>

      <g font-size="14">
        <text x="22" y="84" fill="#7fffd4" fill-opacity="0.7" letter-spacing="2">ROLE</text>
        <text x="130" y="84" fill="#ffffff">Software Dev Engineer</text>

        <text x="22" y="122" fill="#7fffd4" fill-opacity="0.7" letter-spacing="2">CLOUD</text>
        <text x="130" y="122" fill="#ffffff">AWS · Azure · GCP</text>

        <text x="22" y="160" fill="#7fffd4" fill-opacity="0.7" letter-spacing="2">AI</text>
        <text x="130" y="160" fill="#ffffff">Claude Certified Architect</text>

        <text x="22" y="198" fill="#7fffd4" fill-opacity="0.7" letter-spacing="2">DSA</text>
        <text x="130" y="198" fill="#ffffff">LeetCode · CF · CodeChef</text>

        <text x="22" y="236" fill="#7fffd4" fill-opacity="0.7" letter-spacing="2">STATUS</text>
        <circle cx="138" cy="231" r="6" fill="#28c840">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="154" y="236" fill="#28c840">Building</text>
      </g>

      <rect x="22" y="254" width="296" height="6" rx="3" fill="#0a2a21"/>
      <rect x="22" y="254" width="120" height="6" rx="3" fill="#4ff0c0">
        <animate attributeName="x" values="22;198;22" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
