<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 290" width="490" height="290" role="img" aria-label="GEOSTORM - Real-time global climate dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03171f"/>
      <stop offset="100%" stop-color="#0a4a3a"/>
    </linearGradient>
    <radialGradient id="globe" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4ff0c0"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </radialGradient>
    <clipPath id="r"><rect width="490" height="290" rx="18"/></clipPath>
    <clipPath id="g"><circle cx="420" cy="62" r="34"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <rect width="490" height="290" fill="url(#bg)"/>
    <rect x="1" y="1" width="488" height="288" rx="17" fill="none" stroke="#1D9E75" stroke-opacity="0.6"/>

    <!-- globe -->
    <circle cx="420" cy="62" r="34" fill="url(#globe)"/>
    <g clip-path="url(#g)" fill="none" stroke="#ccffee" stroke-opacity="0.55" stroke-width="1.2">
      <ellipse cx="420" cy="62" rx="34" ry="12"/>
      <ellipse cx="420" cy="62" rx="14" ry="34"/>
      <line x1="386" y1="62" x2="454" y2="62"/>
      <ellipse cx="420" cy="62" rx="34" ry="34">
        <animate attributeName="rx" values="34;6;34" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <circle cx="420" cy="62" r="46" fill="none" stroke="#4ff0c0" stroke-opacity="0.35" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 420 62" to="360 420 62" dur="18s" repeatCount="indefinite"/>
    </circle>

    <text x="28" y="50" font-size="13" fill="#4ff0c0" letter-spacing="4" font-family="Consolas, Menlo, monospace">PROJECT 01</text>
    <text x="28" y="88" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="3">GEOSTORM</text>
    <text x="28" y="116" font-size="16" fill="#9ffbe0">Real-time global climate dashboard</text>

    <text x="28" y="152" font-size="13.5" fill="#d6fff2" fill-opacity="0.85">Interactive visualizations of live climate indicators,</text>
    <text x="28" y="172" font-size="13.5" fill="#d6fff2" fill-opacity="0.85">making climate data accessible to everyone.</text>

    <!-- award pill -->
    <rect x="28" y="190" width="338" height="26" rx="13" fill="#ffc83d" fill-opacity="0.15" stroke="#ffc83d" stroke-opacity="0.7"/>
    <text x="42" y="208" font-size="12.5" fill="#ffd978" font-weight="600">★ Fan Favorite · Google Maps Platform Awards 2025</text>

    <!-- tech pills -->
    <g font-size="12" font-family="Consolas, Menlo, monospace" fill="#ccffee">
      <rect x="28" y="238" width="92" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="74" y="255" text-anchor="middle">TypeScript</text>
      <rect x="128" y="238" width="58" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="157" y="255" text-anchor="middle">Vite</text>
      <rect x="194" y="238" width="80" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="234" y="255" text-anchor="middle">Tailwind</text>
      <rect x="282" y="238" width="84" height="26" rx="13" fill="#1D9E75" fill-opacity="0.25" stroke="#1D9E75"/>
      <text x="324" y="255" text-anchor="middle">Supabase</text>
    </g>
  </g>
</svg>
